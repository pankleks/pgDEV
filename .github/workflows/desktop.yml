name: Desktop migration checks

on:
  push:
    paths: ['desktop/**', 'crates/**', 'test/native-catalog-*', 'web/src/lib/browserSearch.ts', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'crates/**', 'test/native-catalog-*', 'web/src/lib/browserSearch.ts', 'Cargo.toml', 'Cargo.lock', 'package.json', 'package-lock.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build:desktop:web
      - run: node --import tsx --test test/native-catalog-tree.mjs
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p pgdev-core --locked
