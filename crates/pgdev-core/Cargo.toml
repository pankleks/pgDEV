[package]
name = "pgdev-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
serde.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true
uuid.workspace = true
native-tls = "0.2"
postgres-native-tls = "0.5"
futures-util = "0.3"
url = "2"
serde_json = "1"
sha2 = "0.10"
ts-rs = { version = "11", features = ["serde-json-impl"] }
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros"] }
dotenvy = "0.15"
